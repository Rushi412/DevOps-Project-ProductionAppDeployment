name: Quality and deployment validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package
        run: mvn --batch-mode clean verify
      - name: Build container
        run: docker build -t social-platform-app:${{ github.sha }} -f deploy/docker/Dockerfile .
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: pom.xml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          image-ref: social-platform-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Render local Kubernetes overlay
        run: kubectl kustomize deploy/kubernetes/overlays/local > /tmp/social-platform-rendered.yaml
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Validate Terraform configuration without a backend
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
