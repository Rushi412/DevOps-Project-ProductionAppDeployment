# Copy this file to secret.yaml, replace each placeholder, and apply it manually.
# secret.yaml is intentionally ignored by Git.
apiVersion: v1
kind: Secret
metadata:
  name: social-platform-app-secrets
  namespace: social-app
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://HOST:5432/social_platform
  DB_USERNAME: replace_me
  DB_PASSWORD: replace_me
